version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        - (*github.com/jackc/pgx/v5.Tx).Rollback
        - (github.com/jackc/pgx/v5.Tx).Rollback
        - github.com/jackc/pgx/v5.Tx.Rollback
        - (*net/http.Response).Body.Close
        - (io.Closer).Close
        - io.Closer.Close
        - fmt.Fprintf
